<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye-Tracking Prototype</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

  <!-- 2) MediaPipe FaceMesh runtime (defines faceMesh.FaceMesh) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"></script>

  <!-- 3) TF-JS Face-Landmarks detection bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection/dist/face-landmarks-detection.js"></script>

  <!-- 4) Your gaze.js -->
  <script src="gaze.js" defer></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0; padding: 1em;
      background: #fff;
      transition: background-color 0.2s;
    }
    #overlayCursor {
      position: fixed;
      width: 15px; height: 15px;
      background: rgba(255,0,0,0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-50%,-50%);
    }
  </style>
</head>
<body>
  <h1>Eye-Tracking Prototype</h1>
  <p>Allow camera access, then click to calibrate. Red dot follows your gaze.</p>
  <video id="webcam" autoplay playsinline style="display:none;"></video>
  <div id="overlayCursor"></div>
</body>
</html>
